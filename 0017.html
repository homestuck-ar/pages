        <style>
            * {

            body {
                background-color: #666666;
                font-family: 'Courier New', monospace;
                color: #000000;
                direction: rtl;
            }
    
            .navbar {
                background-color: #666666;
                padding: 10px 15px;
                text-align: center;
                font-size: 12px;
            }
    
            .navbar a {
                color: #FFFF00;
                text-decoration: none;
                margin: 0 3px;
                font-weight: bold;
            }
    
            .navbar a:hover {
                text-decoration: underline;
            }
    
            .navbar .green {
                color: #58d458;
            }
    
            .navbar .separator {
                color: #FFFF00;
                margin: 0 3px;
            }
    
            .main-container {
                background-color: #CCCCCC;
                min-height: 100vh;
                padding: 20px;
            }
    
            .content-wrapper {
                max-width: 700px;
                margin: 0 auto;
                background-color: white;
                border: 3px solid #999999;
            }
    
            .page-content {
                padding: 40px;
                text-align: center;
            }
    
            .page-title {
                font-size: 32px;
                margin-bottom: 30px;
                font-weight: bold;
                font-family: 'Courier New', monospace;
            }
    
            .image-container {
                margin: 30px 0;
                text-align: center;
            }
    
            .image-container img {
                max-width: 100%;
                height: auto;
                max-height: 500px;
            }
    
            .description {
                white-space: pre-wrap;
                margin: 30px 0;
                font-size: 16px;
                line-height: 1.6;
                text-align: right;
            }
    
            .page-number {
                font-size: 12px;
                color: #666666;
                margin: 20px 0;
            }
    
            .navigation-links {
                margin: 30px 0;
                text-align: right;
            }
    
            .navigation-links a {
                color: #0000FF;
                text-decoration: underline;
                margin: 0 10px;
                font-size: 14px;
            }
    
            .navigation-links a:hover {
                color: #FF0000;
            }
    
            .footer-links {
                padding: 20px;
                text-align: center;
                border-top: 2px solid #CCCCCC;
                font-size: 12px;
            }
    
            .footer-links a {
                color: #0000FF;
                text-decoration: underline;
                margin: 0 10px;
            }
    
            .footer-links a:hover {
                color: #FF0000;
            }
    
            .pesterlog-container {
                margin: 30px 0;
                border: 2px dashed #999;
                background-color: #f0f0f0;
                border-radius: 5px;
            }
    
            .pesterlog-header {
                display: flex;
                flex-wrap: wrap;
                gap: 2px;
                padding: 5px;
                background-color: #333;
            }
    
            .pesterlog-tab {
                padding: 5px 10px;
                border: 1px solid #000;
                font-weight: bold;
                font-size: 12px;
            }
    
            .pesterlog-content {
                padding: 15px;
                background-color: white;
                max-height: 400px;
                overflow-y: auto;
                font-family: 'Courier New', monospace;
                font-size: 13px;
                line-height: 1.6;
                direction: rtl;
                text-align: right;
            }
    
            .dialogue-line {
                margin: 5px 0;
                word-break: break-word;
            }
    
            .image-container {
                margin: 30px 0;
                text-align: center;
            }
    
            .image-container img {
                max-width: 100%;
                height: auto;
                max-height: 500px;
            }
