                color: #FF0000;
            }
    
            .footer-links {
                padding: 20px;
                text-align: center;
                border-top: 2px solid #CCCCCC;
                font-size: 12px;
            }
    
            .footer-links a {

                text-decoration: underline;
                margin: 0 10px;
            }
    
            .footer-links a:hover {
                color: #FF0000;
            }

                margin: 30px 0;

                gap: 2px;
                padding: 5px;

            }

                padding: 5px 10px;

                font-weight: bold;
                font-size: 12px;
            }
    
            .pesterlog-content {
