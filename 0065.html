            * {

            body {

            .navbar {

                padding: 10px 15px;

            .navbar a {

            }

                margin: 0 auto;
                background-color: white;

            }
    
            .page-content {
                padding: 40px;
                text-align: center;

                margin-bottom: 30px;

            }

                color: #0000FF;
                text-decoration: underline;
                margin: 0 10px;
                font-size: 14px;
            }
    
            .navigation-links a:hover {
                color: #FF0000;
            }
    
            .footer-links {
                padding: 20px;
                text-align: center;
                border-top: 2px solid #CCCCCC;
                font-size: 12px;
            }
    
            .footer-links a {
                color: #0000FF;
                text-decoration: underline;
                margin: 0 10px;
            }
    
            .footer-links a:hover {
                color: #FF0000;
            }
    
            .pesterlog-container {
                margin: 30px 0;
                border: 2px dashed #999;
                background-color: #f0f0f0;
                border-radius: 5px;
            }
    
            .pesterlog-header {
                display: flex;
                flex-wrap: wrap;
                gap: 2px;
                padding: 5px;
                background-color: #333;
            }
    
            .pesterlog-tab {
                padding: 5px 10px;
                border: 1px solid #000;
                font-weight: bold;
                font-size: 12px;
            }
    
            .pesterlog-content {
                padding: 15px;
                background-color: white;
                max-height: 400px;
                overflow-y: auto;
                font-family: 'Courier New', monospace;
                font-size: 13px;
                line-height: 1.6;
                direction: rtl;
                text-align: right;
            }
    
            .dialogue-line {
                margin: 5px 0;
                word-break: break-word;
            }
    
            .image-container {
                margin: 30px 0;
                text-align: center;
            }
    
            .image-container img {
                max-width: 100%;
                height: auto;
                max-height: 500px;
            }

            .swf-container {
              margin: 30px auto;
              text-align: center;
              max-width: 100%;
          }
          
          .ruffle-player {
              width: 100%;

          .ruffle-player {

            height: 400px;
            min-height: 400px;
          }
          
          .ruffle-player ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
          }

  window.addEventListener('load', function () {
    const ruffle = window.RufflePlayer?.newest();

    if (!ruffle) {
      console.error('Ruffle لم يتم تحميله');
      return;
    }

    document.querySelectorAll('.ruffle-player').forEach(function (container) {
      const swfUrl = container.getAttribute('data-swf');

      if (!swfUrl) return;

      const player = ruffle.createPlayer();
      container.appendChild(player);

      player.style.width = '100%';
      player.style.height = '400px';

      player.load({
        url: swfUrl,
        autoplay: 'on',
        unmuteOverlay: 'hidden'
      });
    });
  });
