            }

                color: #0000FF;

                margin: 0 10px;
                font-size: 14px;
            }
    
            .navigation-links a:hover {
                color: #FF0000;
            }
    
            .footer-links {
                padding: 20px;
                text-align: center;
                border-top: 2px solid #CCCCCC;
                font-size: 12px;
            }
    
            .footer-links a {
                color: #0000FF;
                text-decoration: underline;
                margin: 0 10px;
            }
    
            .footer-links a:hover {
                color: #FF0000;
            }

                margin: 30px 0;

                border-radius: 5px;

                display: flex;
                flex-wrap: wrap;
                gap: 2px;
                padding: 5px;
                background-color: #333;
            }
    
            .pesterlog-tab {
                padding: 5px 10px;
                border: 1px solid #000;
                font-weight: bold;
                font-size: 12px;
            }
    
            .pesterlog-content {
                padding: 15px;
                background-color: white;

                direction: rtl;
                text-align: right;
            }
    
            .dialogue-line {
                margin: 5px 0;

            .image-container {
                margin: 30px 0;
                text-align: center;
            }
