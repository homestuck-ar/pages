            }

                text-align: center;
                border-top: 2px solid #CCCCCC;
                font-size: 12px;
            }
    
            .footer-links a {

                text-decoration: underline;
                margin: 0 10px;
            }
    
            .footer-links a:hover {
                color: #FF0000;
            }

                flex-wrap: wrap;
                gap: 2px;
                padding: 5px;
                background-color: #333;
            }

                padding: 5px 10px;
                border: 1px solid #000;
                font-weight: bold;
                font-size: 12px;
            }
    
            .pesterlog-content {
                padding: 15px;
                background-color: white;
                max-height: 400px;
                overflow-y: auto;
                font-family: 'Courier New', monospace;

                direction: rtl;
                text-align: right;
            }
    
            .dialogue-line {
                margin: 5px 0;
                word-break: break-word;
            }
    
            .image-container {
                margin: 30px 0;
                text-align: center;
            }
    
            .image-container img {
                max-width: 100%;
                height: auto;
                max-height: 500px;
            }

    <script>
  window.addEventListener('load', function () {
    const ruffle = window.RufflePlayer?.newest();

    if (!ruffle) {
      console.error('Ruffle لم يتم تحميله');
      return;
    }

    document.querySelectorAll('.ruffle-player').forEach(function (container) {
      const swfUrl = container.getAttribute('data-swf');

      if (!swfUrl) return;

      const player = ruffle.createPlayer();
      container.appendChild(player);

      player.style.width = '100%';
      player.style.height = '400px';

      player.load({
        url: swfUrl,
        autoplay: 'on',
        unmuteOverlay: 'hidden'
      });
    });
  });
</script>
